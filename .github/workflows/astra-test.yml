# Brumdrumherum – ASTRA-Baustellen Region Bern
# Läuft automatisch: nachts und an Werktagen zu Pendelzeiten alle 15 Minuten.
# Von Hand: Reiter «Actions» → «ASTRA Baustellen» → «Run workflow».
# Zeiten in UTC (Schweiz = UTC+1 im Winter, UTC+2 im Sommer).
name: ASTRA Baustellen

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"          # nachts
    - cron: "*/15 4-7 * * 1-5"    # Morgen-Pendelzeit
    - cron: "*/15 14-17 * * 1-5"  # Abend-Pendelzeit

jobs:
  astra-bern:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ASTRA abrufen, auf Bern filtern und an Xano senden
        env:
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          XANO_URL: https://x8ki-letl-twmt.n7.xano.io/api:46MELtpt
        run: node scripts/astra-bern.mjs
      - name: Ergebnis speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-bern
          path: astra-bern.json
          if-no-files-found: ignore
