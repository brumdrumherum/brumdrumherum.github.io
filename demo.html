<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brumdrum">
<title>Brumdrumherum – Demo-Story</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design-Idee: Nachtasphalt + Markierungsgelb.
   Gelb ist in der Schweiz die Farbe provisorischer Baustellenmarkierungen.
   Es steht in der App nur für zwei Dinge: Baustellen und die empfohlene Umfahrung (plus Punkte).
   Die App ist immer dunkel. Die Seite drumherum folgt Hell/Dunkel des Betrachters. */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#EDEFEC; --panel:#FFFFFF; --pink:#161C1F; --pmuted:#5F6B70; --pline:#DCE1DE; --console:#0F1417; --console-ink:#C9D3D0;
  --bg:#0F1417; --s1:#161D21; --s2:#1E272C; --line:#28333A; --ink:#EEF2F0; --muted:#8A979C; --faint:#5C686D;
  --yellow:#F7C948; --yellow-ink:#1C1603; --yellow-soft:rgba(247,201,72,.12);
  --free:#5BD1A0; --slow:#F0A94B; --jam:#F0724B; --limit:#E5484D;
  --astra:#7FA8D9; --bern:#E5484D; --crowd:#B39DDB;
  --road:#26323A; --water:#17313F; --mapbg:#12191C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0A0E10; --panel:#12181B; --pink:#E8EDEA; --pmuted:#8D999D; --pline:#222C31; --console:#080B0D; }
}
:root[data-theme="dark"]{ --page:#0A0E10; --panel:#12181B; --pink:#E8EDEA; --pmuted:#8D999D; --pline:#222C31; --console:#080B0D; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--page);color:var(--pink);font-family:"Signika","Segoe UI",system-ui,sans-serif;font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
h1,h2,h3,h4{margin:0;line-height:1.15;font-weight:600}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Stage ---------- */
.stage{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;padding:26px 22px 44px;align-items:start}
.side{display:grid;gap:14px;position:sticky;top:18px}

/* ---------- Phone ---------- */
.phone{width:390px;height:812px;background:var(--bg);color:var(--ink);border:9px solid #050708;border-radius:48px;position:relative;overflow:hidden;box-shadow:0 30px 70px -20px rgba(10,14,16,.55);display:flex;flex-direction:column;margin:0 auto}
.statusbar{height:40px;display:flex;justify-content:space-between;align-items:center;padding:4px 28px 0;font-size:13.5px;font-weight:600;flex-shrink:0}
.statusbar .sig{display:flex;gap:6px;align-items:center;color:var(--ink)}
.appbar{padding:6px 20px 10px;flex-shrink:0}
.screen{flex:1;overflow-y:auto;padding:4px 20px 110px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.screen{scroll-behavior:auto}}
.hidden{display:none!important}

.tabbar{position:absolute;left:0;right:0;bottom:0;padding:10px 18px 22px;background:linear-gradient(to top,var(--bg) 62%,rgba(15,20,23,0));display:flex;justify-content:space-around}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--faint);cursor:pointer;padding:6px 10px;letter-spacing:.01em}
.tabbar button svg.i{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"]::after{content:"";width:16px;height:3px;border-radius:2px;background:var(--yellow);margin-top:1px}

/* Kopf mit Level */
.me{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:44px;height:44px;flex-shrink:0}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring span{position:absolute;inset:5px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:600;font-size:16px}
.me .who{flex:1;min-width:0}
.me .who small{display:block;color:var(--muted);font-size:12.5px}
.me .who b{font-weight:600;font-size:15px}
.bp{display:flex;align-items:baseline;gap:4px;padding:7px 12px;border-radius:999px;background:var(--yellow-soft);color:var(--yellow);font-weight:600}
.bp small{font-size:11px;font-weight:500;opacity:.8}

.h1{font-size:30px;font-weight:600;letter-spacing:-.01em;margin:16px 0 4px}
.lead{color:var(--muted);font-size:14px;margin:0 0 18px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);padding:0;margin:2px 0 10px;cursor:pointer;font-size:14px}
.back svg.i{width:18px;height:18px}
.label{font-size:12.5px;color:var(--muted);margin:24px 0 10px;display:flex;justify-content:space-between}

/* Strecken-Karte */
.route{display:block;width:100%;text-align:left;cursor:pointer;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.route .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.route h3{font-size:19px}
.route .ft{color:var(--muted);font-size:13.5px;margin-top:3px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--muted)}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.state.warn{color:var(--yellow)}.state.ok{color:var(--free)}
.lane{height:2px;margin:16px 0 14px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 24px)}
.lane.warn{background:repeating-linear-gradient(90deg,var(--yellow) 0 14px,transparent 14px 24px);opacity:.8}
.route .facts{display:flex;gap:18px;font-size:13.5px;color:var(--muted)}
.route .facts span{display:inline-flex;gap:6px;align-items:center}
.route .facts svg.i{width:16px;height:16px}
.route .msg{margin-top:12px;font-size:14px;color:var(--ink)}
.route .today{margin-top:8px;font-size:13.5px;color:var(--yellow)}

.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:18px;padding:14px;color:var(--muted);cursor:pointer}

/* Quests als ruhige Liste */
.list{background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic{width:36px;height:36px;border-radius:12px;background:var(--s2);display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.li.done .ic{background:var(--yellow-soft);color:var(--yellow)}
.li .t{flex:1;min-width:0;font-size:14px}
.li .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.li .pbar{height:3px;background:var(--s2);border-radius:2px;margin-top:8px;overflow:hidden}
.li .pbar i{display:block;height:100%;background:var(--yellow)}
.li .rw{font-size:13px;color:var(--muted);white-space:nowrap}
.li.done .rw{color:var(--yellow)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);font-size:15.5px}
.btn.y{background:var(--yellow);color:var(--yellow-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}

/* Karte */
.mapbox{border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--mapbg)}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:2px 14px 12px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Baustellen */
.site{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.site:first-of-type{border-top:0}
.site .ic{width:36px;height:36px;border-radius:12px;background:var(--yellow-soft);color:var(--yellow);display:grid;place-items:center;flex-shrink:0}
.site.crowd .ic{background:rgba(179,157,219,.12);color:var(--crowd)}
.site h4{font-size:15px;font-weight:500}
.site p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.src{font-size:11.5px;font-weight:600;letter-spacing:.02em}
.src.astra{color:var(--astra)}.src.bern{color:var(--bern)}.src.crowd{color:var(--crowd)}
.sites{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:4px 16px;margin-bottom:6px}
.okbox{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;color:var(--free)}

/* Routenvergleich */
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--s2);color:var(--ink)}
.demo{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin:0 2px 12px}
.demo b{color:var(--slow);font-weight:600}
.cand{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:10px}
.cand.rec{border-color:var(--yellow)}
.cand .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cand .hd h4{font-size:13px;font-weight:500;color:var(--muted)}
.chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 9px;white-space:nowrap}
.chip.rec{background:var(--yellow);color:var(--yellow-ink)}
.chip.on{background:var(--s2);color:var(--ink)}
.cand .via{font-size:17px;font-weight:500;margin:6px 0 2px}
.cand .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.cand .big b{font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em}
.cand .big b small{font-size:15px;font-weight:500;margin-left:2px}
.cand .big span{font-size:13px;color:var(--muted)}
.meter{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.meter .track{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;grid-column:1/-1}
.meter .track i{display:block;height:100%;border-radius:3px}
.meter .l{font-size:13.5px}
.meter .r{font-size:13.5px;font-weight:500}
.cand .foot{font-size:12.5px;color:var(--muted);margin-top:10px}
.cand .foot .tag{color:var(--slow)}
.cand details{margin-top:10px;font-size:12.5px;color:var(--muted)}
.cand summary{cursor:pointer;color:var(--ink);list-style:none}
.cand summary::-webkit-details-marker{display:none}
.cand summary::after{content:" +";color:var(--muted)}
.cand details[open] summary::after{content:" –"}
.cand .row{margin-top:14px}
.cand .row .btn{padding:12px;font-size:14.5px}

/* Formular */
label.f{display:block;font-size:12.5px;color:var(--muted);margin:16px 2px 7px}
select,input[type=time],input[type=text]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--ink);appearance:none}
.days{display:flex;gap:6px}
.days button{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--s1);cursor:pointer;font-size:13px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:10px 2px}
.err{font-size:13px;color:var(--limit);margin:10px 2px;min-height:1em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:12px;font-size:13.5px;text-align:left;cursor:pointer;color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--yellow);color:var(--ink);background:var(--yellow-soft)}
.where{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:14px}
.where svg.i{color:var(--yellow)}
.hintbox{display:flex;gap:10px;font-size:13px;color:var(--muted);background:var(--s1);border-radius:14px;padding:12px 14px;margin-bottom:6px}

/* Adresssuche und Mapbox-Karte */
.addr{position:relative}
.addr .okmark{position:absolute;right:12px;top:12px;color:var(--free)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--s2);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.sugg:empty{display:none}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button:hover,.sugg button:focus-visible{background:var(--s1)}
.sugg .none{padding:11px 14px;font-size:13px;color:var(--muted)}
.mbmap{width:100%}
.mbmap .mapboxgl-ctrl-attrib{font-size:10px}

/* Onboarding: die eine Animation */
.onb{display:flex;flex-direction:column;min-height:100%;padding-top:10px}
.word{font-size:46px;font-weight:600;line-height:.95;letter-spacing:-.02em;margin:18px 0 0}
.word span{display:block}
.word span:nth-child(2){color:var(--muted);font-weight:300}
.detour{display:block;width:100%;height:auto;margin:22px 0 18px}
.detour .blk{fill:var(--s2)}
.detour .main{stroke:var(--line);stroke-width:3;fill:none;stroke-dasharray:10 8}
.detour .alt{stroke:var(--yellow);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-dasharray:10 8;animation:draw 2.4s ease forwards .3s;stroke-dashoffset:400}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.detour .alt{animation:none;stroke-dashoffset:0}}
.onb .lead{font-size:16px;color:var(--muted);max-width:30ch;margin:0 0 24px}
.feat{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.feat .ic{color:var(--yellow);margin-top:1px}
.feat b{display:block;font-weight:500}
.feat span{font-size:13.5px;color:var(--muted)}

/* Sperrbildschirm */
.lock{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 0%,#233038 0%,#11181B 60%,#0B0F11 100%);z-index:5;display:flex;flex-direction:column;align-items:center;padding:78px 14px 24px}
.lock .date{font-size:16px;color:#AEBBBF}
.lock .time{font-size:84px;font-weight:500;line-height:1;margin:6px 0 34px;letter-spacing:-.03em;color:#F4F7F5}
.lock .hint{margin-top:auto;font-size:12.5px;color:#6D7A7F}
.lock .sleep{font-size:14px;color:#8A979C;text-align:center;max-width:24ch}
.notif{width:100%;background:rgba(40,51,58,.72);backdrop-filter:blur(18px);color:#EEF2F0;border-radius:22px;padding:14px;display:flex;gap:12px;cursor:pointer;text-align:left;border:1px solid rgba(255,255,255,.06);animation:drop .5s ease both}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.notif{animation:none}}
.notif .app{width:38px;height:38px;border-radius:10px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;flex-shrink:0}
.notif b{display:block;font-size:14.5px;font-weight:600}
.notif span{font-size:14px;display:block;color:#D5DDDA}
.notif small{color:#8A979C;font-size:12px}

/* Belohnung + Sheets */
.reward{position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 10px;display:flex;align-items:center;gap:10px;z-index:8;opacity:0;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:opacity .25s,transform .25s;width:max-content;max-width:88%}
.reward.show{opacity:1;transform:translate(-50%,0)}
.reward .pts{background:var(--yellow);color:var(--yellow-ink);font-weight:600;border-radius:999px;padding:3px 9px;font-size:13.5px}
.reward .why{font-size:13.5px}
.sheet{position:absolute;inset:0;background:rgba(5,7,8,.65);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.sheet .inner{background:var(--s1);width:100%;border-radius:28px 28px 0 0;padding:26px 22px 30px;border-top:1px solid var(--line)}
.levelup{text-align:center}
.levelup .n{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--yellow);display:grid;place-items:center;font-size:34px;font-weight:600;color:var(--yellow)}
.levelup h3{font-size:24px;margin-bottom:6px}
.levelup p{color:var(--muted);margin:0 0 20px}

/* Profil */
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:6px}
.stat{padding:16px;background:var(--s1)}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
.stat b{font-size:30px;font-weight:600;display:block;line-height:1;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
.impact{border-left:3px solid var(--yellow);padding:4px 0 4px 14px;margin:18px 0 4px;font-size:14px}
.impact span{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;background:var(--s1)}
.badge .ic{width:42px;height:42px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--yellow-soft);color:var(--yellow)}
.badge b{display:block;font-size:12.5px;font-weight:500}
.badge small{font-size:11px;color:var(--muted)}
.badge.locked .ic{background:var(--s2);color:var(--faint)}
.badge.locked b{color:var(--muted)}
.fine{font-size:12px;color:var(--faint);margin-top:18px}

/* ---------- Story-Panel ---------- */
.story{background:var(--panel);border:1px solid var(--pline);border-radius:22px;padding:22px 24px}
.progress{display:flex;gap:4px;margin-bottom:18px}
.progress button{flex:1;height:4px;border-radius:2px;border:0;background:var(--pline);cursor:pointer;padding:0}
.progress button.done{background:var(--pmuted)}
.progress button.cur{background:var(--yellow)}
.stepno{display:flex;align-items:center;gap:12px;color:var(--pmuted);font-size:13.5px}
.stepno .letter{width:34px;height:34px;border-radius:9px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-weight:600;font-size:17px}
.story h2{font-size:27px;letter-spacing:-.01em;margin:14px 0 0}
.story p{margin:12px 0;max-width:66ch}
.tech{background:var(--page);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14px;color:var(--pmuted);max-width:66ch}
.tech b{color:var(--pink);font-weight:600}
.ctrl{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.ctrl button{border-radius:12px;padding:11px 18px;font-weight:500;cursor:pointer;border:1px solid var(--pline);background:transparent;color:var(--pink)}
.ctrl button.primary{background:var(--pink);border-color:var(--pink);color:var(--panel)}
.ctrl button:disabled{opacity:.4;cursor:default}
.ctrl .tip{font-size:13px;color:var(--pmuted)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.summary div{border:1px solid var(--pline);border-radius:14px;padding:12px 14px;font-size:13.5px}
.summary h3{font-size:14px;margin-bottom:6px}
.summary ul{margin:0;padding-left:18px;color:var(--pmuted)}
.more{display:none;background:none;border:0;color:var(--pmuted);font-weight:500;padding:6px 0 0;cursor:pointer;text-decoration:underline}

.box{background:var(--panel);border:1px solid var(--pline);border-radius:22px;padding:16px 18px}

// swisstopo Näherungsformel LV95 -> WGS84
function lv95ToWgs84(E,N){
  const y=(E-2600000)/1e6, x=(N-1200000)/1e6;
  const lam=2.6779094+4.728982*y+0.791484*y*x+0.1306*y*x*x-0.0436*y*y*y;
  const phi=16.9023892+3.238272*x-0.270978*y*y-0.002528*x*x-0.0447*y*y*x-0.0140*x*x*x;
  return [phi*100/36, lam*100/36];
}
function haversine(a,b){
  const R=6371000, r=Math.PI/180, dp=(b[0]-a[0])*r, dl=(b[1]-a[1])*r;
  const h=Math.sin(dp/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function densify(line,step){
  const out=[];
  for(let i=0;i<line.length-1;i++){
    const a=line[i], b=line[i+1], n=Math.max(1,Math.floor(haversine(a,b)/step));
    for(let k=0;k<n;k++) out.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
  }
  out.push(line[line.length-1]); return out;
}
function bbox(line,pad){
  let a=[90,180,-90,-180];
  line.forEach(p=>{a[0]=Math.min(a[0],p[0]);a[1]=Math.min(a[1],p[1]);a[2]=Math.max(a[2],p[0]);a[3]=Math.max(a[3],p[1]);});
  return [a[0]-pad,a[1]-pad,a[2]+pad,a[3]+pad];
}

function demoHourFactor(h){ return (h>=6.5&&h<9)?1 : (h>=16.5&&h<19)?0.95 : 0.45; }

function dtvToHourlyEstimate(dtv, share){ return Math.round(dtv*(share||0.10)); }

async function getTrafficVolume(seg, hour){
  const tried = [];
  for(const src of TRAFFIC_SOURCES){
    if(!src.connected){ tried.push(src.id); continue; }
    const v = await src.fetch(seg, hour);
    if(v) return {vph:v.vph, source:src.id, kind:src.kind, tried};
  }
  return {vph:null, source:null, kind:"none", tried};
}

  8:  {aus:1400, inn:900,  lanes:1, note:"Hauptstrasse; innerorts reduziert wegen Knoten und Lichtsignalen"},
  20: {aus:1200, inn:800,  lanes:1, note:"Hauptstrasse schmaler; innerorts reduziert"},
  9:  {aus:900,  inn:600,  lanes:1, note:"Nebenstrasse"},
  10: {aus:500,  inn:400,  lanes:1, note:"Quartierstrasse"}
};
function estimateRoadCapacity(attr){
  // attr: {objektart, innerorts, lanesPerDirection?}
  // Fahrstreifen pro Richtung sind in swissTLM3D nicht enthalten → Annahme aus Tabelle,
  // ausser der Wert wird übergeben (z. B. später aus kantonalen Daten).
  const row = CAPACITY_PER_LANE[attr.objektart] || CAPACITY_PER_LANE[9];
  const lanes = attr.lanesPerDirection || row.lanes;
  const perLane = attr.objektart===2 || attr.objektart===21 || attr.objektart<=1 ? row.aus : (attr.innerorts ? row.inn : row.aus);
  return { vph: perLane*lanes, estimated:true, lanes, lanesAssumed:!attr.lanesPerDirection,
    basis:`${TLM_OBJEKTART[attr.objektart]||"unbekannt"}, ${lanes} Fahrstreifen/Richtung, ${attr.innerorts&&attr.objektart>2?"innerorts":"ausserorts"}: ${row.note}` };
}
// Schnittstelle für später: echte Attribute von swisstopo holen (geo.admin Identify, Layer ch.swisstopo.swisstlm3d-strassen).
function roadAttributes(line, i){ return {objektart: line.obj[i], innerorts: line.innerorts, source:"demo"}; }

/* ======================================================================
   MODUL 3: AUSLASTUNG UND KLASSIFIKATION
   Auslastung = Verkehrsstärke / Kapazität × 100
   ⚠ Die Klassengrenzen sind eine VEREINFACHTE APP-KLASSIFIKATION,
   KEINE offiziellen Schweizer Grenzwerte.
   ====================================================================== */
function utilization(vph, cap){ return vph==null ? null : Math.round(vph/cap*100); }
const UTIL_CLASSES = [
  {max:60,  label:"Freie Kapazität",        color:"var(--free)"},
  {max:80,  label:"Erhöhte Belastung",      color:"var(--slow)"},
  {max:95,  label:"Hohe Belastung",         color:"var(--jam)"},
  {max:Infinity, label:"Nahe Kapazitätsgrenze", color:"var(--limit)"}
];
function classifyUtilization(u){ return u==null ? {label:"Keine Daten", color:"var(--line)"} : UTIL_CLASSES.find(c=>u<c.max); }
function loadColor(u){ return classifyUtilization(u).color; }

/* ======================================================================
   MODUL 4: ROUTENBEWERTUNG
   routeScore = travelTime + congestionPenalty + constructionPenalty + lengthPenalty
   Kleiner = besser. Belastung verbietet keine Route, sie verschlechtert nur den Score.
   Gewichte sind App-Annahmen und in User-Tests zu kalibrieren.
   ====================================================================== */
const SCORE = {
  constructionDelayMin: 3,   // zusätzliche Fahrzeit pro Baustelle auf der Route (Annahme)
  constructionPenalty: 5,    // Score-Malus pro Baustelle, zusätzlich zur Fahrzeit
  congestionFrom: 60,        // ab dieser Auslastung (%) gibt es Malus
  congestionPerPct: 0.25,    // Minuten Malus pro Prozentpunkt über congestionFrom
  lengthPerKm: 0.5,          // Minuten Malus pro zusätzlichem Kilometer Umweg
  betterBy: 2                // Alternative wird nur empfohlen, wenn Score mind. so viel besser ist
};
// Fahrzeit je Abschnitt nach BPR-Funktion (Bureau of Public Roads, Standardformel der
// Verkehrsplanung): t = t0 × (1 + 0.15 × (v/c)^4)
function bprTime(t0, v, c){ return v==null ? t0 : t0*(1+0.15*Math.pow(v/c,4)); }

/* Entscheid Team: kein Live-Verkehrsfluss. Die Routenwahl beruht auf Fahrzeit, Baustellen und Umweg.
   Die Module für Verkehrsdaten und Kapazität bleiben im Code für eine spätere Erweiterung (z. B. KSVD). */
const USE_TRAFFIC = false;
async function evaluateLine(l, hour, opts){
  opts = opts||{};
  const lens=[]; for(let i=0;i<l.pts.length-1;i++) lens.push(haversine(l.pts[i],l.pts[i+1]));
  const total = lens.reduce((a,b)=>a+b,0);
  const segs=[]; let t=0, sources=new Set(), missing=0;
  for(let i=0;i<lens.length;i++){
    if(!USE_TRAFFIC || !l.vph){ t += l.min*lens[i]/total; segs.push({len:lens[i], vph:null, cap:{vph:null}, u:null, attr:null}); continue; }
    const attr = roadAttributes(l,i);
    const cap = estimateRoadCapacity(attr);
    const tv = await getTrafficVolume({demoVph:l.vph[i], mid:l.pts[i]}, hour);
    // Architektur für spätere Verteilung: bereits zugewiesene Fahrzeuge (opts.extraLoad) addieren
    const vph = tv.vph==null ? null : tv.vph + ((opts.extraLoad||{})[i]||0);
    if(tv.source) sources.add(tv.kind); else missing++;
    const u = utilization(vph, cap.vph);
    t += bprTime(l.min*lens[i]/total, vph, cap.vph);
    segs.push({len:lens[i], vph, cap, u, attr});
  }
  const sites = sitesOn(l.pts, l.live);
  t += sites.length*SCORE.constructionDelayMin;
  const known = segs.filter(s=>s.u!=null);
  const util = known.length ? Math.round(known.reduce((a,s)=>a+s.u*s.len,0)/known.reduce((a,s)=>a+s.len,0)) : null;
  const peak = known.length ? known.reduce((m,s)=>s.u>m.u?s:m, known[0]) : null;
  return {via:l.via, normal:l.min, min:Math.round(t), km:total/1000, segs, sites, util, peak,
    pts:l.pts, loads:segs.map(s=>s.u), lens, total, dataKinds:[...sources], missing};
}
function routeScore(ev, baseKm){
  const congestionPenalty = ev.util==null ? 0 : Math.max(0, ev.util-SCORE.congestionFrom)*SCORE.congestionPerPct;
  const constructionPenalty = ev.sites.length*SCORE.constructionPenalty;
  const lengthPenalty = Math.max(0, ev.km-baseKm)*SCORE.lengthPerKm;
  return {total: ev.min + congestionPenalty + constructionPenalty + lengthPenalty, travelTime:ev.min, congestionPenalty, constructionPenalty, lengthPenalty};
}
async function evaluateRoutes(L, hour, opts){
  const cands = [Object.assign({key:"main"}, L)].concat(L.alts.map((a,i)=>Object.assign({key:"alt"+i, altIdx:i}, a)));
  const out = [];
  for(const c of cands){ const ev = await evaluateLine(c, hour, opts); ev.key=c.key; ev.altIdx=c.altIdx; out.push(ev); }
  const baseKm = out[0].km;
  out.forEach(ev=>{ ev.score = routeScore(ev, baseKm); ev.detourMin = ev.min - L.min; ev.detourKm = ev.km - baseKm; });
  const best = out.slice(1).reduce((b,e)=>e.score.total<b.score.total?e:b, out[0]);
  const recommended = (best!==out[0] && out[0].score.total-best.score.total>=SCORE.betterBy) ? best : out[0];
  return {candidates:out, recommended};
}

/* ---------- Baustellen-Abgleich für beliebige Linien ---------- */
// Abstand Strecke ↔ Baustelle. Echte Baustellen (Stadt Bern) sind Flächen: dann zählt der
// nächste Punkt der Fläche, damit auch lange Baustellen erkannt werden. Sonst der Mittelpunkt.
function incDist(dense, inc){
  const targets = inc.pts || [[inc.lat, inc.lon]];
  let best = Infinity;
  for(const p of dense){ for(const q of targets){ const d = haversine(p, q); if(d < best) best = d; } }
  return best;
}
function incNearBox(inc, bb){
  if(inc.bb) return !(inc.bb[2] < bb[0] || inc.bb[0] > bb[2] || inc.bb[3] < bb[1] || inc.bb[1] > bb[3]);
  return !(inc.lat<bb[0]||inc.lat>bb[2]||inc.lon<bb[1]||inc.lon>bb[3]);
}
// Echte Strecken nutzen die Live-Baustellen von Xano (falls geladen), die Story bleibt bei den Beispieldaten.
function incidentPool(live){ if(REAL) return liveIncidents; return (live && liveIncidents.length) ? liveIncidents : incidents; }
// ASTRA wird über Autobahnanschlüsse verortet (Mittelpunkt der Rampen). Das ist ungenauer als die
// Flächen der Stadt Bern, deshalb gilt dort ein Korridor von 250 m statt 100 m.
const ASTRA_THRESHOLD_M = 250;
const thresholdFor = inc => inc.quelle === "astra" ? ASTRA_THRESHOLD_M : THRESHOLD_M;
// Nachtsperrungen (z.B. 20:00–05:00) betreffen Pendelnde nicht und lösen keine Warnung aus.
const warns = inc => inc.aktiv && !inc.night_only;
function sitesOn(pts, live){
  const dense=densify(pts,20), bb=bbox(pts,0.004), out=[];
  for(const inc of incidentPool(live)){
    if(!warns(inc) || !incNearBox(inc, bb)) continue;
    const best = incDist(dense, inc);
    if(best<=thresholdFor(inc)) out.push({inc,dist:Math.round(best)});
  }
  return out;
}
function ensureData(){
  if(incidents.length) return;
  incidents = importAstra().concat(importBern()).map(i=>Object.assign(i,{aktiv:isRelevant(i)}));
  matches = match().res; lastRun = new Date(TODAY);
}
async function checkRoute(r,hour){
  ensureData();
  const L=routeLine(r);
  const res = await evaluateRoutes(L,hour);
  const main = res.candidates[0], rec = res.recommended;
  return {hour, main, candidates:res.candidates, rec, better: rec!==main, saves: main.min-rec.min, alt:rec};
}
const hourOf = t => { const [h,m]=t.split(":").map(Number); return h+m/60; };
const todayKey = () => TODAY.toISOString().slice(0,10);
const RIVER = [[46.9290,7.4580],[46.9380,7.4540],[46.9440,7.4500],[46.9465,7.4560],[46.9500,7.4535],[46.9515,7.4460],[46.9535,7.4400],[46.9600,7.4370],[46.9680,7.4410],[46.9720,7.4350],[46.9760,7.4250]];

/* ---------- Import pipelines ---------- */
function importAstra(){
  const doc = new DOMParser().parseFromString(DATEX_XML,"application/xml");
  const recs = doc.getElementsByTagNameNS("*","situationRecord");
  const out = [];
  for(const r of recs){
    const q = t => (r.getElementsByTagNameNS("*",t)[0]||{}).textContent;
    out.push({id:r.getAttribute("id"), quelle:"astra", titel:q("value"),
      typ:r.getAttributeNS("http://www.w3.org/2001/XMLSchema-instance","type"),
      start:q("overallStartTime").slice(0,10), ende:q("overallEndTime").slice(0,10),
      lat:parseFloat(q("latitude")), lon:parseFloat(q("longitude"))});
  }
  return out;
}
function importBern(){
  return KOER_GEOJSON.features.map(f=>{
    const ring = f.geometry.coordinates[0].slice(0,-1);
    const E = ring.reduce((s,p)=>s+p[0],0)/ring.length, N = ring.reduce((s,p)=>s+p[1],0)/ring.length;
    const [lat,lon] = lv95ToWgs84(E,N);
    const p = f.properties;
    return {id:"KOER-"+p.OBJECTID, quelle:"stadt_bern", titel:p.Locality+": "+p.Project, typ:p.StatusTxt,
      start:p.StartDate, ende:p.EndDate, lat, lon, lv95:[E,N]};
  });
}
function isRelevant(inc){
  const s=new Date(inc.start+"T00:00:00"), e=new Date(inc.ende+"T23:59:59");
  const horizon = new Date(TODAY.getTime()+7*86400000);
  return s<=horizon && e>=TODAY;
}
function match(){
  const t0 = performance.now(); const res={}; let checks=0, boxed=0;
  for(const r of S.routes){
    const L = routeLine(r); if(!L){res[r.id]=[];continue;}
    const dense = densify(L.pts,20), bb = bbox(L.pts,0.01), hits=[];
    for(const inc of incidentPool(L.live)){
      if(!warns(inc)) continue;
      checks++;
      if(!incNearBox(inc, bb)) continue;
      boxed++;
      const best = incDist(dense, inc);
      if(best<=thresholdFor(inc)) hits.push({inc, dist:Math.round(best)});
      else res["_near_"+r.id]=(res["_near_"+r.id]||[]).concat([{inc,dist:Math.round(best)}]);
    }
    res[r.id]=hits;
  }
  return {res, ms:performance.now()-t0, checks, boxed};
}

// Der Token steht in der Datei config.js (wird bei Updates nicht überschrieben).
const MAPBOX_TOKEN = (window.BRUM_CONFIG && window.BRUM_CONFIG.MAPBOX_TOKEN) || "HIER_DEN_MAPBOX_TOKEN_EINFUEGEN";
/* Ohne Token läuft die App im Demo-Modus mit
   der gezeichneten Skizze und vier festen Strecken.
   Hinweis: Dieser Token ist in der App sichtbar. Das ist bei Karten
   üblich. Ohne hinterlegte Kreditkarte kann Mapbox nichts verrechnen,
   im schlimmsten Fall ist das Gratiskontingent aufgebraucht.

const MB_ON = /^pk\./.test(MAPBOX_TOKEN);
const MB_VERSION = "v3.3.0";
let mbReady = false, mbMaps = [], mbPending = [], mbSeq = 0, mbFlushQueued = false;

function loadMapbox(){
  if(!MB_ON) return;
  const css = document.createElement("link");
  css.rel = "stylesheet"; css.href = `https://api.mapbox.com/mapbox-gl-js/${MB_VERSION}/mapbox-gl.css`;
  document.head.appendChild(css);
  const s = document.createElement("script");
  s.src = `https://api.mapbox.com/mapbox-gl-js/${MB_VERSION}/mapbox-gl.js`;
  s.onload = () => { try{ mapboxgl.accessToken = MAPBOX_TOKEN; mbReady = true; render(); }catch(e){ mbReady = false; } };
  s.onerror = () => { mbReady = false; };
  document.head.appendChild(s);
}

// Karte: echte Mapbox-Karte, wenn verfügbar und gewünscht (opts.real), sonst die Skizze.
function mapBlock(highlight, hits, opts){
  opts = opts || {};
  if(!(MB_ON && mbReady && opts.real)) return mapSVG(highlight, hits, opts);
  const id = "mb" + (++mbSeq);
  mbPending.push({id, highlight, hits: hits || [], opts});
  if(!mbFlushQueued){ mbFlushQueued = true; setTimeout(flushMaps, 0); }
  return `<div id="${id}" class="mbmap" style="height:${opts.h || 240}px"></div>`;
}
function flushMaps(){
  mbFlushQueued = false;
  mbMaps = mbMaps.filter(m => { if(!document.body.contains(m.getContainer())){ try{ m.remove(); }catch(e){} return false; } return true; });
  const list = mbPending; mbPending = [];
  list.forEach(spec => {
    const el = document.getElementById(spec.id); if(!el) return;
    const ll = p => [p[1], p[0]];
    const pts = (spec.highlight || []).map(ll), alt = (spec.opts.alt || []).map(ll);
    const hitPts = spec.hits.map(x => ({type:"Feature", properties:{crowd: x.inc.quelle === "crowd"}, geometry:{type:"Point", coordinates:[x.inc.lon, x.inc.lat]}}));
    const all = pts.concat(alt, hitPts.map(h => h.geometry.coordinates));
    let m;
    try{
      m = new mapboxgl.Map({container: el, style: "mapbox://styles/mapbox/dark-v11", center: all[0] || [7.44, 46.95], zoom: 12, attributionControl: true});
    }catch(e){ el.outerHTML = mapSVG(spec.highlight, spec.hits, spec.opts); return; }
    mbMaps.push(m);
    m.on("load", () => {
      const line = coords => ({type:"Feature", geometry:{type:"LineString", coordinates: coords}});
      if(pts.length){
        m.addSource("route", {type:"geojson", data: line(pts)});
        m.addLayer({id:"route-case", type:"line", source:"route", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#0F1417","line-width":9}});
        m.addLayer({id:"route", type:"line", source:"route", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#EEF2F0","line-width":5}});
        m.addSource("ends", {type:"geojson", data:{type:"FeatureCollection", features:[
          {type:"Feature", properties:{end:false}, geometry:{type:"Point", coordinates: pts[0]}},
          {type:"Feature", properties:{end:true},  geometry:{type:"Point", coordinates: pts[pts.length-1]}}]}});
        m.addLayer({id:"ends", type:"circle", source:"ends", paint:{"circle-radius":6, "circle-color":["case",["get","end"],"#EEF2F0","#0F1417"], "circle-stroke-color":"#EEF2F0", "circle-stroke-width":2.5}});
      }
      if(alt.length){
        m.addSource("alt", {type:"geojson", data: line(alt)});
        m.addLayer({id:"alt", type:"line", source:"alt", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#F7C948","line-width":5,"line-dasharray":[1.6,1.3]}});
      }
      if(hitPts.length){
        m.addSource("hits", {type:"geojson", data:{type:"FeatureCollection", features: hitPts}});
        m.addLayer({id:"hits", type:"circle", source:"hits", paint:{"circle-radius":9, "circle-color":["case",["get","crowd"],"#B39DDB","#F7C948"], "circle-stroke-color":"#0F1417", "circle-stroke-width":2}});
      }
      if(all.length > 1){
        const b = new mapboxgl.LngLatBounds(); all.forEach(c => b.extend(c));
        m.fitBounds(b, {padding: 36, duration: 0, maxZoom: 15});
      }
    });
  });
}

async function geocode(q){
  const u = `https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(q)}&country=ch&language=de&limit=5&proximity=7.44,46.95&access_token=${MAPBOX_TOKEN}`;
  const r = await fetch(u); if(!r.ok) throw new Error("Geocoding " + r.status);
  const j = await r.json();
  return (j.features || []).map(f => ({
    label: (f.properties && (f.properties.full_address || [f.properties.name, f.properties.place_formatted].filter(Boolean).join(", "))) || "Unbekannt",
    lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1]
  }));
}
async function directions(a, b){
  const u = `https://api.mapbox.com/directions/v5/mapbox/driving/${a.lon},${a.lat};${b.lon},${b.lat}?alternatives=true&geometries=geojson&overview=full&language=de&access_token=${MAPBOX_TOKEN}`;
  const r = await fetch(u); if(!r.ok) throw new Error("Directions " + r.status);
  const j = await r.json();
  if(!j.routes || !j.routes.length) throw new Error("Keine Route gefunden");
  return j.routes.map((rt, k) => ({
    via: (rt.legs && rt.legs[0] && rt.legs[0].summary) || ("Route " + (k + 1)),
    min: Math.round(rt.duration / 60), km: rt.distance / 1000,
    pts: rt.geometry.coordinates.map(c => [c[1], c[0]])
  }));
}

function ringOf(g){

  if(g.type === "Point") return [g.coordinates];              // ASTRA: einzelner Anschluss

}

let rd = null, geoTimer = null;
function renderNewReal(){
  rd = rd || {name:"Arbeitsweg", fromQ:"", toQ:"", from:null, to:null, time:"07:40", days:[1,2,3,4,5], res:null, err:"", busy:false};
  appbar.innerHTML = `${S.routes.length?`<button class="back" id="back">${icon("back")}Abbrechen</button>`:""}<h2 class="h1">Neue Strecke</h2><p class="lead" style="margin:0">Adressen eingeben, die Route wird berechnet</p>`;
  if($("back")) $("back").onclick = () => { rd = null; go("home"); };
  const field = (k, label, q, ok) => `<label class="f" for="a_${k}">${label}</label>
    <div class="addr"><input id="a_${k}" type="text" autocomplete="off" placeholder="Strasse und Ort" value="${esc(q)}">${ok?`<span class="okmark">${icon("check")}</span>`:""}<div class="sugg" id="s_${k}" role="listbox"></div></div>`;
  const r0 = rd.res && rd.res[0];
  screen.innerHTML = `
    <label class="f" for="nName">Name</label><input id="nName" type="text" value="${esc(rd.name)}">
    ${field("from","Start",rd.fromQ,!!rd.from)}
    ${field("to","Ziel",rd.toQ,!!rd.to)}
    <div style="height:14px"></div>
    <button class="btn ${r0?"ghost":""}" id="calc" ${rd.from&&rd.to&&!rd.busy?"":"disabled"}>${icon("route")}${rd.busy?"Route wird berechnet …":r0?"Neu berechnen":"Route berechnen"}</button>
    <div class="err" id="nErr" role="alert">${esc(rd.err||"")}</div>
    ${r0?`<div class="mapbox">${mapBlock(r0.pts, [], {h:200, real:true})}</div>
      <p class="note" style="margin-top:-4px">Via ${esc(r0.via)}, ${r0.min} Min., ${r0.km.toFixed(1)} km${rd.res.length>1?`. ${rd.res.length-1} Alternative${rd.res.length>2?"n":""} gefunden.`:"."}</p>
      <label class="f" for="nTime">Übliche Abfahrt</label><input type="time" id="nTime" value="${rd.time}">
      <label class="f">Tage</label><div class="days">${[1,2,3,4,5,6,0].map(d=>`<button type="button" data-d="${d}" aria-pressed="${rd.days.includes(d)}">${DAYN[d]}</button>`).join("")}</div>
      <div style="height:18px"></div>
      <button class="btn y" id="nSave">Strecke überwachen</button>`:""}
    <p class="note">Adresssuche und Route von Mapbox. Gespeichert wird nur die Linie der Strecke.</p>`;
  $("nName").oninput = e => { rd.name = e.target.value; };
  ["from","to"].forEach(k => {
    const inp = $("a_"+k), box = $("s_"+k);
    inp.oninput = () => {
      rd[k+"Q"] = inp.value; rd[k] = null; rd.res = null;
      $("calc").disabled = true;
      clearTimeout(geoTimer);
      if(inp.value.trim().length < 3){ box.innerHTML = ""; return; }
      geoTimer = setTimeout(async () => {
        try{
          const list = await geocode(inp.value.trim());
          box.innerHTML = list.length ? list.map((s,i)=>`<button type="button" role="option" data-i="${i}">${esc(s.label)}</button>`).join("") : `<div class="none">Keine Adresse gefunden</div>`;
          box.querySelectorAll("button").forEach(b => b.onclick = () => { const s = list[+b.dataset.i]; rd[k] = s; rd[k+"Q"] = s.label; rd.err = ""; renderNewReal(); });
        }catch(e){ box.innerHTML = `<div class="none">Adresssuche nicht erreichbar. Ist der Mapbox-Token eingetragen?</div>`; }
      }, 300);
    };
  });
  $("calc").onclick = async () => {
    rd.busy = true; rd.err = ""; renderNewReal();
    try{ rd.res = await directions(rd.from, rd.to); }
    catch(e){ rd.res = null; rd.err = "Route konnte nicht berechnet werden. Prüfe die Adressen oder die Internetverbindung."; }
    rd.busy = false; renderNewReal();
  };
  if(r0){
    $("nTime").onchange = e => { rd.time = e.target.value; };
    screen.querySelectorAll(".days button").forEach(b => b.onclick = () => { const d = +b.dataset.d; rd.days = rd.days.includes(d) ? rd.days.filter(x=>x!==d) : rd.days.concat(d); renderNewReal(); });
    $("nSave").onclick = () => {
      if(!rd.days.length){ rd.err = "Wähle mindestens einen Tag."; renderNewReal(); return; }
      const [main, ...alts] = rd.res;
      const r = {id:"r"+(S.nextId++), kind:"real", name: rd.name.trim() || shortLabel(rd.fromQ)+" → "+shortLabel(rd.toQ),
        fromL: rd.from.label, toL: rd.to.label, from:{lat:rd.from.lat, lon:rd.from.lon}, to:{lat:rd.to.lat, lon:rd.to.lon},
        time: rd.time || "07:40", days: rd.days.slice(), on:true, geom: main.pts, via: main.via, min: main.min, km: main.km, alts};
      S.routes.push(r); rd = null;
      ensureData(); matches = match().res;
      const first = S.routes.length === 1;
      log(`<span class="ok">App: Neue Strecke «${esc(r.name)}» mit Mapbox berechnet (${r.min} Min., ${alts.length} Alternative(n)) und gespeichert</span>`);
      go("detail", r.id);
      if(first) addXP(REWARD.firstRoute, "Erste Strecke gespeichert", "first");
    };
  }
}

/* ======================================================================
   GAMIFICATION
   Brum-Punkte (BP) belohnen Verhalten, das dem Verkehr hilft:
   vor der Abfahrt prüfen, entlastende Route nehmen, Baustellen melden.
   Im Prototyp ohne Geldwert. Einlösen bei Partnern = Idee, nicht validiert.
   ====================================================================== */
const LEVELS = [
  {min:0,   name:"Stau-Neuling"},
  {min:100, name:"Pendel-Profi"},
  {min:250, name:"Umfahrungs-Ass"},
  {min:500, name:"Verkehrs-Flüsterer"}
];
const BADGES = {
  first:  {ic:"route",  name:"Erste Strecke",   how:"Strecke speichern"},
  checker:{ic:"radar",  name:"Lagecheck",       how:"Vor Abfahrt prüfen"},
  reroute:{ic:"detour", name:"Entlastung",     how:"Empfehlung nehmen"},
  scout:  {ic:"cone",   name:"Baustellen-Scout",how:"Baustelle melden"},
  streak5:{ic:"flame",  name:"5 Tage am Stück", how:"5 Tage clever pendeln"},
  level2: {ic:"star",   name:"Level 2",         how:"100 BP erreichen"}
};
const REWARD = { firstRoute:50, check:10, reroute:30, report:20, dayDone:15 };
function levelOf(xp){ let i=0; LEVELS.forEach((l,k)=>{ if(xp>=l.min) i=k; }); return i; }
function levelProgress(xp){
  const i=levelOf(xp), cur=LEVELS[i], next=LEVELS[i+1];
  return {i, cur, next, pct: next ? Math.round((xp-cur.min)/(next.min-cur.min)*100) : 100};
}
let rewardTimer;
function addXP(n, why, badge, quiet){
  const before = levelOf(S.xp);
  S.xp += n;
  if(badge && !S.badges.includes(badge)) S.badges.push(badge);
  const after = levelOf(S.xp);
  if(after>before && !S.badges.includes("level2")) S.badges.push("level2");
  if(quiet||FAST) return after>before;
  $("rwPts").textContent = "+"+n; $("rwWhy").textContent = why;
  const r=$("reward"); r.classList.add("show"); clearTimeout(rewardTimer);
  rewardTimer = setTimeout(()=>r.classList.remove("show"), 2600);
  render();
  if(after>before) setTimeout(()=>showLevelUp(after), reduce()?0:900);
  return after>before;
}
function showLevelUp(i){
  openSheet(`<div class="levelup"><div class="n">${i+1}</div><h3>${LEVELS[i].name}</h3>
    <p>Level ${i+1} erreicht. ${LEVELS[i+1]?`Nächstes Ziel: ${LEVELS[i+1].name} ab ${LEVELS[i+1].min} BP.`:"Höchstes Level."}</p>
    <button class="btn y" id="lvOk">Weiter</button></div>`);
  $("lvOk").onclick = closeSheet;
}
function ring(pct){
  const r=19, c=2*Math.PI*r;
  return `<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--s2)" stroke-width="3"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--yellow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}" style="transition:stroke-dasharray .6s ease"/></svg>`;
}
function meHeader(){
  const p = levelProgress(S.xp);
  return `<div class="me">
    <div class="ring" role="img" aria-label="Level ${p.i+1}, ${p.pct} Prozent bis zum nächsten">${ring(p.pct)}<span>M</span></div>
    <div class="who"><small>Level ${p.i+1}</small><b>${p.cur.name}</b></div>
    <div class="bp tnum" title="Brum-Punkte">${S.xp}<small>BP</small></div>
  </div>`;
}
function openSheet(html){ $("sheetInner").innerHTML=html; $("sheet").classList.add("show"); }
function closeSheet(){ $("sheet").classList.remove("show"); }
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeSheet(); });

  $("tabbar").classList.toggle("hidden", noTabs); document.body.classList.toggle("notabs", noTabs);
  document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-current", b.dataset.go===view.name || (view.name==="detail"&&b.dataset.go==="home")));
  ({onboarding:renderOnboarding, home:renderHome, new:renderNew, detail:renderDetail, map:renderMapScreen, report:renderReport, profile:renderProfile})[view.name]();
  saveLocal();
}
/* --- Speichern auf dem Handy (nur echte App) ---
   Strecken, Meldungen und Punkte bleiben auf diesem Gerät. Kein Login: Jedes Gerät hat eine
   zufällige, anonyme Nummer (für die spätere Anmeldung bei Xano für Push-Nachrichten). */
const STORE_KEY = "brum:state:1", DEVICE_KEY = "brum:device";
function saveLocal(){ if(!REAL) return; try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const x = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if(x && Array.isArray(x.routes)) return Object.assign(FRESH(), x); }catch(e){} return null; }
function deviceId(){ try{ let id = localStorage.getItem(DEVICE_KEY); if(!id){ id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); localStorage.setItem(DEVICE_KEY, id); } return id; }catch(e){ return null; } }
function resetLocal(){ try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(DEVICE_KEY); }catch(e){} location.reload(); }
function daysText(d){ return d.length===5 && [1,2,3,4,5].every(x=>d.includes(x)) ? "Mo–Fr" : d.slice().sort().map(x=>DAYN[x]).join(", "); }
function chosenAlt(r,L){ return r.altDay===todayKey() && L.alts[r.altIdx||0] ? L.alts[r.altIdx||0] : null; }

function startDraft(){ draft = draft || {from:"koeniz", to:"bern_hb", time:"07:40", days:[1,2,3,4,5], name:"Arbeitsweg"}; }
function renderNew(){
  if(MB_ON && view.param!=="demo") return renderNewReal();
  startDraft();
  appbar.innerHTML = `${S.routes.length?`<button class="back" id="back">${icon("back")}Abbrechen</button>`:""}<h2 class="h1">Neue Strecke</h2><p class="lead" style="margin:0">Wohin fährst du regelmässig?</p>`;

  const L = lineFor(draft.from, draft.to);
  screen.innerHTML = `
    <label class="f" for="nName">Name</label><input id="nName" type="text" value="${esc(draft.name)}">
    <div class="row"><div style="flex:1"><label class="f" for="nFrom">Start</label><select id="nFrom">${opts(draft.from)}</select></div>
      <div style="flex:1"><label class="f" for="nTo">Ziel</label><select id="nTo">${opts(draft.to)}</select></div></div>

    <label class="f">Tage</label><div class="days">${[1,2,3,4,5,6,0].map(d=>`<button type="button" data-d="${d}" aria-pressed="${draft.days.includes(d)}">${DAYN[d]}</button>`).join("")}</div>
    <div class="err" id="nErr" role="alert"></div>
    <button class="btn y" id="nSave" ${L?"":"disabled"}>Strecke überwachen</button>
    <p class="note">Gespeichert wird nur die Linie der Strecke, kein Standortverlauf.</p>`;
  const sync=()=>{ draft.name=$("nName").value; draft.from=$("nFrom").value; draft.to=$("nTo").value; draft.time=$("nTime").value; };
  $("nFrom").onchange=$("nTo").onchange=()=>{sync();renderNew();};
  $("nName").oninput=$("nTime").onchange=sync;
  screen.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{sync();const d=+b.dataset.d;draft.days=draft.days.includes(d)?draft.days.filter(x=>x!==d):draft.days.concat(d);renderNew();});
  $("nSave").onclick=()=>{
    sync();
    if(draft.from===draft.to){ $("nErr").textContent="Start und Ziel sind gleich. Wähle ein anderes Ziel."; return; }
    if(!draft.days.length){ $("nErr").textContent="Wähle mindestens einen Tag."; return; }
    saveDraft(); tourHook("saveRoute");
  };
}
function saveDraft(){
  const r = {id:"r"+(S.nextId++), name:draft.name.trim()||PLACES[draft.from]+" → "+PLACES[draft.to], from:draft.from, to:draft.to, time:draft.time||"07:40", days:draft.days.slice(), on:true};
  S.routes.push(r); draft=null;
  if(lastRun){ matches = match().res; }
  const first = S.routes.length===1;
  go("home");
  if(first) addXP(REWARD.firstRoute, "Erste Strecke gespeichert", "first");
  return r;
}

      <span class="rw tnum">${q.done?"Erledigt":"+"+q.rw}</span></div>`).join("")}</div>`;
  screen.querySelectorAll(".route").forEach(b=>b.onclick=()=>go("detail",b.dataset.id));

/* --- Karte ---
   Signatur: Die empfohlene Umfahrung erscheint wie eine provisorische,
   gelbe Baustellenmarkierung. Die übliche Route wie eine Strasse mit Mittellinie. */
function mapSVG(highlight, hitList, opts){
  opts=opts||{};
  const W=360, H=opts.h||240;
  const all=[].concat(...Object.values(LINES).map(l=>l.pts));
  const b = highlight ? bbox(opts.alt?highlight.concat(opts.alt):highlight,0.004) : bbox(all,0.004);
  const cos=Math.cos(46.95*Math.PI/180), scale=Math.min(W/((b[3]-b[1])*cos), H/(b[2]-b[0]));
  const cx=(b[1]+b[3])/2, cy=(b[0]+b[2])/2;
  const P = p => [(W/2+(p[1]-cx)*cos*scale).toFixed(1),(H/2-(p[0]-cy)*scale).toFixed(1)];
  const path = pts => "M"+pts.map(p=>P(p).join(",")).join(" L");
  const RL = 'stroke-linecap="round" stroke-linejoin="round" fill="none"';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Karte">`;
  s+=`<path d="${path(RIVER)}" stroke="var(--water)" stroke-width="12" ${RL}/>`;
  Object.values(LINES).forEach(l=>{ [l].concat(l.alts).forEach(x=>{ s+=`<path d="${path(x.pts)}" stroke="var(--road)" stroke-width="4" ${RL}/>`; }); });
  if(highlight){
    if(opts.loads){
      for(let i=0;i<highlight.length-1;i++) s+=`<path d="${path([highlight[i],highlight[i+1]])}" stroke="${loadColor(opts.loads[i])}" stroke-width="7" ${RL}/>`;
    } else {
      s+=`<path d="${path(highlight)}" stroke="var(--ink)" stroke-width="8" ${RL}/>`;
    }
    s+=`<path d="${path(highlight)}" stroke="var(--mapbg)" stroke-width="1.2" stroke-dasharray="5 6" ${RL}/>`;
  }
  if(opts.alt){
    s+=`<path d="${path(opts.alt)}" stroke="var(--yellow)" stroke-width="5" stroke-dasharray="9 7" ${RL}/>`;
  }
  if(highlight){
    const a=P(highlight[0]), z=P(highlight[highlight.length-1]);
    s+=`<circle cx="${a[0]}" cy="${a[1]}" r="6" fill="var(--mapbg)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${z[0]}" cy="${z[1]}" r="6.5" fill="var(--ink)"/>`;
  }
  (hitList||[]).forEach(x=>{ const q=P([x.inc.lat,x.inc.lon]), crowd=x.inc.quelle==="crowd";
    s+=`<g transform="translate(${q[0]},${q[1]})"><circle r="11" fill="${crowd?"var(--crowd)":"var(--yellow)"}"/><g transform="translate(-6,-6.5) scale(.5)" fill="none" stroke="#1C1603" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M10 4h4l4.5 15h-13z"/><path d="M3.5 19.5h17"/></g></g>`; });
  return s+`</svg>`;
}
function siteRow(x){
  const i=x.inc, q=i.quelle;
  const ref = i.live ? new Date() : TODAY;
  const when = i.start ? (new Date(i.start+"T00:00:00")>ref ? `ab ${fmtD(i.start)}` : (i.ende ? `bis ${fmtD(i.ende)}` : "laufend")) : "heute gemeldet";
  return `<div class="site ${q==="crowd"?"crowd":""}"><span class="ic">${icon("cone")}</span><div>
    <div class="src ${srcCls[q]}">${srcLabel[q]}${q==="crowd"?", nicht verifiziert":""}</div>
    <h4>${esc(i.titel)}</h4><p>${when}${i.night_only?`, nur nachts ${i.daily_from||""}–${i.daily_to||""}`:""}, ${x.dist} m von deiner Strecke</p></div></div>`;
}
function crowdHits(pts){
  const dense=densify(pts,20);
  return S.reports.map(p=>({inc:p, dist:Math.round(Math.min(...dense.map(q=>haversine(q,[p.lat,p.lon]))))})).filter(x=>x.dist<=THRESHOLD_M);
}

function modeHour(r){ return checkMode==="now" ? TODAY.getHours()+TODAY.getMinutes()/60 : hourOf(r.time); }
async function doCheck(r){
  const btn=$("checkBtn"); if(btn){ btn.disabled=true; btn.textContent="Routen werden verglichen …"; }

  render();

function takeAlt(r, idx){
  const L=routeLine(r), ch=chosenAlt(r,L);
  if(ch && (r.altIdx||0)===idx){ r.altDay=null; render(); return; }
  r.altDay=todayKey(); r.altIdx=idx;

  log(`<span class="ok">App: Nutzer übernimmt «${esc(L.alts[idx].via)}» für heute. Zählt als zugewiesene Fahrt (Grundlage für spätere Verteilung).</span>`);
  S.stats.reroutes++; if(c) S.stats.savedMin += Math.max(0, cr.main.min - c.min);
  showAlt=true; render();
  addXP(REWARD.reroute, "Entlastungs-Bonus", "reroute");
  tourHook("takeAlt");
}
function compareCards(r,cr,L,ch){
  const demo = !(r.kind==="real" && liveIncidents.length);
  const sorted = cr.candidates.slice().sort((a,b)=>(b===cr.rec)-(a===cr.rec));
  return `${demo?`<div class="demo">${icon("info")}<span><b>Beispieldaten.</b> Die Baustellen sind nachgebaute Einträge, bis das Backend die echten Daten von ASTRA und Stadt Bern holt.</span></div>`:`<div class="demo">${icon("check")}<span><b style="color:var(--free)">Echte Daten.</b> Baustellen der Stadt Bern, live aus Xano. ASTRA folgt.</span></div>`}
    ${sorted.map(c=>candCard(c,cr,ch)).join("")}`;
}
function candCard(c,cr,ch){
  const cls=classifyUtilization(c.util), rec=c===cr.rec, chosen = ch && c.via===ch.via;
  const name = c.key==="main" ? "Übliche Route" : `Alternative ${c.altIdx+1}`;
  const extra = c.detourMin>0 ? `+${c.detourMin} Min. ${c.key==="main"?"Verzögerung":"Umweg"}` : c.detourMin<0 ? `${c.detourMin} Min.` : "wie üblich";
  const km = c.key==="main" ? `${c.km.toFixed(1)} km` : `${c.detourKm>=0?"+":""}${c.detourKm.toFixed(1)} km`;
  const sc=c.score;
  return `<div class="cand ${rec?"rec":""}">
    <div class="hd"><h4>${name}</h4>${chosen?`<span class="chip on">Heute gewählt</span>`:rec?`<span class="chip rec">Empfohlen${c.key!=="main"?`, +${REWARD.reroute} BP`:""}</span>`:""}</div>
    <div class="via">${esc(c.via)}</div>
    <div class="big"><b class="tnum">${c.min}<small>Min.</small></b><span>${extra}</span><span>${km}</span></div>
    <div class="foot">${c.sites.length?`${c.sites.length} Baustelle${c.sites.length>1?"n":""} auf dieser Route`:"Keine Baustelle auf dieser Route"}.</div>
    <details><summary>So bewertet</summary>Score ${sc.total.toFixed(1)} = Fahrzeit ${sc.travelTime} + Baustellen ${sc.constructionPenalty} + Umweg ${sc.lengthPenalty.toFixed(1)}. Tiefer ist besser. Jede Baustelle zählt 3 Minuten Fahrzeit und 5 Punkte Malus.</details>
    ${c.key!=="main" && (rec||chosen) ? `<div class="row">
      <button class="btn ${chosen?"ghost":"y"}" data-take="${c.altIdx}">${chosen?"Zurück zur üblichen Route":"Übernehmen"}</button>
      ${chosen?"":`<button class="btn ghost" id="showAlt" style="width:auto;padding:12px 16px">${showAlt?"Karte aus":"Karte"}</button>`}</div>`:""}
  </div>`;
}

async function compareRoutes(r, hour, verbose){
  if(verbose){
    log(`\n<span class="dim">Routenvergleich «${esc(r.name)}» für ${hour===hourOf(r.time)?"Abfahrt "+r.time:"jetzt"}</span>`);
    await wait(200); log(`<span class="dim">  Bewertung: Fahrzeit + Baustellen + Umweg (kein Live-Verkehr)</span>`);
  }
  const res = await checkRoute(r, hour); checkRes[r.id] = res;
  if(verbose){
    res.candidates.forEach(c=>log(`  ${c.key==="main"?"Übliche Route":"Alternative"} via ${esc(c.via)}: ${c.min} Min., ${c.km.toFixed(1)} km, ${c.sites.length} Baustelle(n), Score ${c.score.total.toFixed(1)}`));
    log(res.better ? `<span class="warn">  → Empfehlung: via ${esc(res.rec.via)}</span>` : `<span class="ok">  → Übliche Route bleibt die beste Wahl</span>`);
  }
  return res;
}

let cur = 0, busy = false;
function scrollToCmp(){ const el=$("cmp"); if(el) screen.scrollTop = el.offsetTop - 8; }
async function gotoStep(i, replay){
  if(busy) return; busy=true;
  if(replay){
    S=FRESH(); incidents=[]; matches={}; lastRun=null; checkRes={}; draft=null; reportDraft=null; showAlt=false; closeSheet();
    logEl.innerHTML=LOG_PLACEHOLDER; delete logEl.dataset.used;
    FAST=true; for(let k=0;k<i;k++) await STEPS[k].enter(); FAST=false;
  }
  cur=i; renderStory();
  await STEPS[i].enter();
  busy=false; renderStory();
}
function next(){ if(cur<STEPS.length-1) gotoStep(cur+1,false); }
function prev(){ if(cur>0) gotoStep(cur-1,true); }
// Wenn der Nutzer im Handy selbst die erwartete Aktion macht, geht die Story weiter.
function tourHook(action){
  const st=STEPS[cur]; if(busy || !st || st.expect!==action) return;
  setTimeout(()=>{ cur++; renderStory(); busy=true; STEPS[cur].enter().then(()=>{busy=false; renderStory();}); }, reduce()?0:1300);
}

function renderSrcTbl(){ $("srcTbl").innerHTML = [
  `<tr><td><strong>ASTRA Baustellen</strong><br><span class="no">opentransportdata.swiss, DATEX II</span></td><td>Baustellen National- und Kantonsstrassen</td><td class="no">${liveStatus==="ok"?`live über GitHub Actions und Xano: ${liveIncidents.filter(i=>i.quelle==="astra").length} Meldungen Region Bern, verortet über Autobahnanschlüsse`:"Beispieleinträge in der Story"}</td></tr>`,

  ,`<tr><td><strong>Mapbox</strong><br><span class="no">Karte, Adresssuche, Routing mit Alternativen</span></td><td>Echte Strassen und Routen</td><td class="no">${MB_ON?"aktiv (Token eingetragen)":"Demo-Modus: Token noch nicht eingetragen"}</td></tr>`
].join(""); }

if(!document.body.classList.contains("force")) document.body.classList.toggle("appmode", mq.matches);

  document.body.classList.add("notour","real");

  lastRun = new Date(); // Abgleich mit Live-Daten ist sofort möglich
  go(S.onboarded ? "home" : "onboarding");
} else {
  gotoStep(0,true);
}
loadLiveIncidents();
})();
